[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-forward-parser"
version = "0.1.3"
description = "Python Library to parse forwarded email messages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "structlog>=26.1,<27",
]
license = { file = "LICENSE" }
keywords = ["email", "forwarded-email", "parser", "eml", "mime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Communications :: Email",
    "Topic :: Text Processing",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1,<27",
    "isort>=8.0.1,<9",
    "mypy>=2.3,<3",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]
test = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7,<8",
]

[project.urls]
Homepage = "https://github.com/felipehertzer/email-forward-parser-py"
Repository = "https://github.com/felipehertzer/email-forward-parser-py"
Issues = "https://github.com/felipehertzer/email-forward-parser-py/issues"

[tool.pytest.ini_options]
minversion = "9.1.1"
addopts = "-ra --strict-config --strict-markers --cov=emailforwardparser --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
source = ["emailforwardparser"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.isort]
combine_as_imports = true
profile = "black"
py_version = 314
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These are executable multilingual fixtures; rewriting locale punctuation changes matching.
"emailforwardparser/regexs.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.14"
files = ["emailforwardparser", "tests"]
pretty = true
strict = true
warn_unreachable = true
show_error_codes = true

[tool.hatch.build.targets.wheel]
packages = ["emailforwardparser"]

[tool.ruff.lint.isort]
combine-as-imports = true
